name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Versión publicada: el catálogo compara su APP_VERSION con version.json y, si hay una
      # más nueva, se recarga solo al volver a la pestaña (pestañas que quedan abiertas días).
      - name: Marcar versión publicada
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__BUILD__/$V/" beepex-cuyo.html
          printf '{"v":"%s"}\n' "$V" > version.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Ensure the site is served from the repository root
          # No destination_dir needed as we want files at root of gh-pages
