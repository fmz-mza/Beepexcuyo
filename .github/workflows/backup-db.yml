name: Backup Supabase (cifrado)

on:
  workflow_dispatch:
  # Programación DESACTIVADA hasta validar la primera corrida manual y un restore de prueba
  # (ver supabase/BACKUP.md). Para activarla, descomentar. Domingos 06:00 UTC = 03:00 Argentina:
  # schedule:
  #   - cron: '0 6 * * 0'

permissions:
  contents: read

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Diagnóstico de SUPABASE_DB_URL sin exponer la contraseña: imprime esquema,
      # usuario, host, puerto y base, y el LARGO de la contraseña (nunca su valor),
      # para descartar espacios de más, el placeholder [YOUR-PASSWORD] sin
      # reemplazar, o un usuario/host distinto al esperado del pooler.
      - name: Diagnosticar cadena de conexión (sin exponer la contraseña)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Falta el secreto SUPABASE_DB_URL"; exit 1; }

          RAW_LEN=${#SUPABASE_DB_URL}
          TRIMMED=$(printf '%s' "$SUPABASE_DB_URL" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          TRIM_LEN=${#TRIMMED}
          if [ "$RAW_LEN" != "$TRIM_LEN" ]; then
            echo "::warning::El secreto tiene espacios o saltos de línea de más ($RAW_LEN vs $TRIM_LEN caracteres tras recortar). Volvé a pegarlo sin espacios extra al principio o al final."
          fi

          if [[ "$TRIMMED" =~ ^([a-zA-Z]+)://([^:@/]+):([^@]*)@([^:@/]+):([0-9]+)/(.+)$ ]]; then
            ESQUEMA="${BASH_REMATCH[1]}"; USUARIO="${BASH_REMATCH[2]}"; CLAVE="${BASH_REMATCH[3]}"
            HOST="${BASH_REMATCH[4]}"; PUERTO="${BASH_REMATCH[5]}"; BASE="${BASH_REMATCH[6]}"
            echo "esquema: $ESQUEMA"
            echo "usuario: $USUARIO"
            echo "host: $HOST"
            echo "puerto: $PUERTO"
            echo "base: $BASE"
            echo "largo de la contraseña: ${#CLAVE} caracteres (el valor nunca se imprime)"

            [ "$USUARIO" = "postgres.mmerrzniuxbrjryhcsda" ] || echo "::error::Usuario inesperado. Debería ser 'postgres.mmerrzniuxbrjryhcsda' y es '$USUARIO'."
            [ "$HOST" = "aws-1-sa-east-1.pooler.supabase.com" ] || echo "::warning::Host distinto al esperado del Session pooler ('aws-1-sa-east-1.pooler.supabase.com'). Es '$HOST'."
            [ "$PUERTO" = "5432" ] || echo "::warning::Puerto distinto al esperado (5432). Es '$PUERTO'."
            [ "$BASE" = "postgres" ] || echo "::warning::Base distinta a 'postgres'. Es '$BASE'."
            case "$CLAVE" in
              *'[YOUR-PASSWORD]'*|'YOUR-PASSWORD') echo "::error::La contraseña sigue siendo el placeholder [YOUR-PASSWORD] sin reemplazar." ;;
              '['*|*']') echo "::error::La contraseña empieza o termina con un corchete. Los corchetes de [YOUR-PASSWORD] son solo una marca de Supabase para indicar dónde va la contraseña — no van en el valor final. Sacalos y dejá solo la contraseña." ;;
              *' '*) echo "::warning::La contraseña contiene un espacio. Si no lo pusiste a propósito, puede ser un espacio pegado por error." ;;
            esac
            [ "${#CLAVE}" -ge 8 ] || echo "::warning::La contraseña parece muy corta (${#CLAVE} caracteres)."
            if printf '%s' "$CLAVE" | LC_ALL=C grep -q '[^ -~]'; then
              echo "::warning::La contraseña tiene un carácter no imprimible o no-ASCII (posible carácter invisible pegado por el portapapeles)."
            fi

            # Huella (no reversible) para comparar con la contraseña real sin exponerla en el log.
            # En PowerShell, con tu contraseña real, calculá la misma huella así (no la compartas
            # acá, solo el resultado de 12 caracteres):
            #   $b=[Text.Encoding]::UTF8.GetBytes('TU_CONTRASEÑA'); ([BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($b)) -replace '-','').ToLower().Substring(0,12)
            HUELLA=$(printf '%s' "$CLAVE" | sha256sum | cut -c1-12)
            echo "huella de la contraseña (12 caracteres, no reversible): $HUELLA"
          else
            echo "::error::No se pudo interpretar SUPABASE_DB_URL como postgresql://usuario:clave@host:puerto/base. Revisá que se haya copiado la cadena completa del Session pooler."
          fi

      # Supabase usa PostgreSQL 17: pg_dump debe ser de versión igual o mayor que el servidor.
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_DB_URL" || { echo "::error::Falta el secreto SUPABASE_DB_URL"; exit 1; }
          PGBIN=/usr/lib/postgresql/17/bin
          mkdir -p work out
          echo "FECHA=$(date -u +%Y-%m-%d_%H%M)" >> "$GITHUB_ENV"

          # Esquema + datos de public: tablas, vistas, funciones, triggers y políticas RLS.
          "$PGBIN/pg_dump" "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --schema=public --file=work/public.dump

          # Usuarios de login (necesarios para restaurar cuentas). Solo datos: en un proyecto
          # nuevo las tablas de auth ya existen.
          "$PGBIN/pg_dump" "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
            --data-only -t auth.users -t auth.identities --file=work/auth.dump

      - name: Verificar que los volcados son legibles y completos
        run: |
          set -euo pipefail
          PGBIN=/usr/lib/postgresql/17/bin
          for f in public auth; do
            "$PGBIN/pg_restore" --list "work/$f.dump" > "work/$f.list"
          done
          for t in clients pos_orders order_items payments payment_allocations profiles user_prices; do
            grep -q "TABLE DATA public $t " work/public.list || { echo "::error::Falta la tabla public.$t en el volcado"; exit 1; }
          done
          grep -q "TABLE DATA auth users " work/auth.list || { echo "::error::Falta auth.users en el volcado"; exit 1; }
          test "$(stat -c%s work/public.dump)" -gt 10000 || { echo "::error::El volcado public es sospechosamente chico"; exit 1; }

      # El repo es PÚBLICO y sus artefactos los puede descargar cualquiera con cuenta de GitHub:
      # NUNCA se sube nada sin cifrar.
      - name: Cifrar (AES-256) y comprobar que se puede descifrar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Falta el secreto BACKUP_PASSPHRASE"; exit 1; }
          OUT="out/beepex-backup-${FECHA}.tar.gpg"
          tar -C work -cf work/backup.tar public.dump auth.dump
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 --output "$OUT" work/backup.tar

          # Prueba de descifrado: debe listar los dos archivos
          LISTA=$(printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt "$OUT" | tar -tf -)
          echo "$LISTA" | grep -qx "public.dump"
          echo "$LISTA" | grep -qx "auth.dump"

          rm -rf work   # borra todo lo que quedó sin cifrar
          {
            echo "### Backup generado"
            echo "- Archivo: \`beepex-backup-${FECHA}.tar.gpg\`"
            echo "- Tamaño: $(du -h "$OUT" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir backup cifrado
        uses: actions/upload-artifact@v4
        with:
          name: beepex-backup-${{ env.FECHA }}
          path: out/*.tar.gpg
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Notificar a Discord
        if: always()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESULTADO: ${{ job.status }}
        run: |
          [ -n "$WEBHOOK" ] || exit 0
          if [ "$RESULTADO" = "success" ]; then
            MSG="✅ Backup de Supabase generado y cifrado (${FECHA:-sin fecha})."
          else
            MSG="❌ Falló el backup de Supabase. Revisá los logs en GitHub Actions."
          fi
          curl -s -H "Content-Type: application/json" -d "{\"username\":\"Beepex Bot\",\"content\":\"$MSG\"}" "$WEBHOOK" > /dev/null || true
