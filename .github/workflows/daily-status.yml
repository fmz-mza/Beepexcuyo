name: Daily WhatsApp Status

on:
  schedule:
    - cron: '0 12 * * *'  # 9am Argentina (UTC-3)
  workflow_dispatch:        # permite correr manualmente desde GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --prefix daily-status

      - name: Generate and send image
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node daily-status/generate.js

      - name: Commit updated used-products log
        run: |
          git config user.name "beepex-bot"
          git config user.email "bot@beepex.com"
          git add daily-status/used-products.json
          git diff --staged --quiet || git commit -m "chore: update used products [skip ci]"
          git push
